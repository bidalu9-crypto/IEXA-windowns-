name: Windows regression
on: [push, pull_request]
permissions:
  contents: read
jobs:
  security-and-runtime:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run vendor:check
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run electron:runtime
      - run: npm run electron:rebuild
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build desktop-agent/Iexa.DesktopAgent.csproj -c Release
