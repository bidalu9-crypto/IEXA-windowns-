<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workspace Pulse</title>
<style>
:root{color-scheme:dark;--bg:#1c1c1f;--fg:#ececee;--muted:#a0a0a8;--line:#34343a;--surface:#242428} :root[data-theme=light]{color-scheme:light;--bg:#fff;--fg:#242426;--muted:#707078;--line:#e7e7ea;--surface:#f7f7f8}*{box-sizing:border-box}body{margin:0;padding:32px;font:13px system-ui,sans-serif;background:var(--bg);color:var(--fg)}header{display:flex;gap:12px;justify-content:space-between;align-items:start}h1{margin:0 0 8px;font-size:22px;font-weight:600;letter-spacing:-.5px}p{color:var(--muted);line-height:1.7;margin:0}button,input{font:inherit;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--fg);padding:9px 12px}button{cursor:pointer}button:disabled{opacity:.5}label{display:flex;align-items:center;gap:10px;margin:24px 0}input{width:70px}.metrics{display:flex;gap:14px;margin:22px 0}.metric{flex:1;padding:18px;border:1px solid var(--line);border-radius:9px}.metric small{color:var(--muted)}.metric strong{display:block;font-size:24px;margin-top:6px;font-weight:500}.table{overflow:auto;border:1px solid var(--line);border-radius:9px}table{width:100%;border-collapse:collapse;text-align:left;font-size:12px}td,th{padding:12px 16px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}th{color:var(--muted);font-weight:500}#status{margin-top:18px;min-height:22px;color:var(--muted);font-size:12px}.note{margin-top:18px;font-size:11px}#cancel[hidden]{display:none}@media(max-width:600px){body{padding:18px}header{flex-wrap:wrap}}
</style><script src="_iexa-sdk.js"></script></head><body>
<header><div><h1>Workspace Pulse</h1><p>工作区概览 · 真实文件信息，不是演示数据</p></div><div><button id="refresh" disabled>刷新快照</button> <button id="cancel" hidden>取消</button></div></header>
<label>展示数量 <input id="limit" type="number" min="1" max="50" value="12"> <button id="save" disabled>保存偏好</button></label>
<div id="metrics" class="metrics"></div><div class="table"><table><thead><tr><th>名称</th><th>类型</th><th>大小</th></tr></thead><tbody id="rows"></tbody></table></div>
<div id="status" role="status">正在连接拓展工作台…</div><p class="note">面板使用受限通信端口调用本插件工具。偏好通过宿主持久化；聊天中的结果保留为独立快照。</p>
<script src="panel.js"></script></body></html>
