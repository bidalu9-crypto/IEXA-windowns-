<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 18px; color: CanvasText; background: Canvas; }
    h1 { margin: 0 0 5px; font-size: 17px; }
    p { margin: 0 0 14px; color: GrayText; font-size: 12px; }
    .form-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 7px; }
    input, button { height: 32px; border: 1px solid ButtonBorder; border-radius: 7px; font: inherit; }
    input { min-width: 0; padding: 0 10px; color: CanvasText; background: Field; }
    button { padding: 0 13px; color: ButtonText; background: ButtonFace; cursor: pointer; }
    output { display: block; min-height: 44px; margin-top: 10px; padding: 10px; border: 1px solid ButtonBorder; border-radius: 7px; color: CanvasText; font-size: 12px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Hello Dashboard</h1>
  <p>这个界面运行在沙箱中，通过 IEXA 消息桥调用插件工具。</p>
  <div class="form-row"><input id="name" value="IEXA" aria-label="姓名"><button id="run" type="button">生成问候</button></div>
  <output id="output">等待执行</output>
  <script>
    const pending = new Map();
    let bridge = null;
    const waiting = [];
    function callTool(tool, args) {
      const requestId = Math.random().toString(36).slice(2);
      const message = { type: 'iexa-plugin-call', requestId, tool, arguments: args };
      if (bridge) bridge.postMessage(message); else waiting.push(message);
      return new Promise((resolve, reject) => pending.set(requestId, { resolve, reject }));
    }
    addEventListener('message', (event) => {
      if (event.data?.type !== 'iexa-plugin-init' || !event.ports?.[0]) return;
      bridge = event.ports[0];
      bridge.onmessage = handleResult;
      bridge.start();
      while (waiting.length) bridge.postMessage(waiting.shift());
    });
    function handleResult(event) {
      if (event.data?.type !== 'iexa-plugin-result') return;
      const request = pending.get(event.data.requestId);
      if (!request) return;
      pending.delete(event.data.requestId);
      event.data.error ? request.reject(new Error(event.data.error)) : request.resolve(event.data.result);
    }
    async function runGreeting() {
      const output = document.getElementById('output');
      output.textContent = '执行中...';
      try { output.textContent = JSON.stringify(await callTool('greet', { name: document.getElementById('name').value, formal: false }), null, 2); }
      catch (error) { output.textContent = error.message; }
    }
    document.getElementById('run').addEventListener('click', runGreeting);
    document.getElementById('name').addEventListener('keydown', (event) => {
      if (event.key === 'Enter') { event.preventDefault(); runGreeting(); }
    });
  </script>
</body>
</html>
