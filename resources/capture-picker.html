<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>选择要截图的画面</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    flex-direction: column;
    background: #14161c;
    color: #e8eaf0;
    font: 13px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    user-select: none;
  }
  header { padding: 18px 22px 12px; }
  h1 { margin: 0 0 4px; font-size: 15px; font-weight: 600; letter-spacing: .01em; }
  .hint { margin: 0; color: #8f96a6; font-size: 12px; }
  main {
    flex: 1;
    overflow-y: auto;
    padding: 4px 22px 18px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
    align-content: start;
  }
  .card {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 8px;
    border: 1px solid #262a35;
    border-radius: 12px;
    background: #191c24;
    color: inherit;
    text-align: left;
    font: inherit;
    cursor: pointer;
    transition: border-color 120ms ease, background 120ms ease, transform 120ms ease;
  }
  .card:hover { border-color: #3d4d78; background: #1d2130; transform: translateY(-1px); }
  .card:focus-visible { outline: 2px solid #5b8cff; outline-offset: 2px; }
  .thumb {
    aspect-ratio: 16 / 10;
    border-radius: 8px;
    background: #0d0f14 center/cover no-repeat;
    box-shadow: inset 0 0 0 1px #232733;
  }
  .meta { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .name {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    font-size: 12.5px;
  }
  .kind {
    flex: 0 0 auto;
    padding: 1px 7px;
    border-radius: 999px;
    background: #232838;
    color: #9aa3b8;
    font-size: 10.5px;
  }
  footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 22px;
    border-top: 1px solid #232733;
  }
  .foot-hint { color: #7b8294; font-size: 11.5px; }
  .cancel {
    padding: 7px 16px;
    border: 1px solid #2d3240;
    border-radius: 8px;
    background: transparent;
    color: #c3c8d4;
    font: inherit;
    font-size: 12.5px;
    cursor: pointer;
  }
  .cancel:hover { background: #1d2130; color: #fff; }
  .empty {
    grid-column: 1 / -1;
    padding: 48px 0;
    text-align: center;
    color: #7b8294;
    font-size: 12.5px;
  }
</style>
</head>
<body>
<header>
  <h1>选择要截图的画面</h1>
  <p class="hint">选中后可框选区域，并用矩形、箭头或画笔标注，完成后直接进入输入框。</p>
</header>
<main id="grid" role="listbox" aria-label="可截图的画面"></main>
<footer>
  <span class="foot-hint">Enter 确认 · Esc 取消</span>
  <button type="button" class="cancel" id="cancel">取消</button>
</footer>
<script>
  const grid = document.getElementById('grid');
  let cards = [];

  function focusCard(index) {
    if (!cards.length) return;
    const next = (index + cards.length) % cards.length;
    cards[next].focus();
  }

  function render(sources) {
    grid.replaceChildren();
    cards = [];
    if (!sources.length) {
      const empty = document.createElement('p');
      empty.className = 'empty';
      empty.textContent = '没有可截取的画面。';
      grid.appendChild(empty);
      return;
    }
    for (const source of sources) {
      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'card';
      card.setAttribute('role', 'option');
      card.setAttribute('aria-label', source.name);

      const thumb = document.createElement('div');
      thumb.className = 'thumb';
      if (source.thumbnail) thumb.style.backgroundImage = `url("${source.thumbnail}")`;

      const meta = document.createElement('div');
      meta.className = 'meta';
      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = source.name;
      const kind = document.createElement('span');
      kind.className = 'kind';
      kind.textContent = source.kind === 'screen' ? '屏幕' : '窗口';
      meta.append(name, kind);

      card.append(thumb, meta);
      card.addEventListener('click', () => window.capturePicker.choose(source.id));
      card.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          window.capturePicker.choose(source.id);
        } else if (event.key === 'ArrowRight' || event.key === 'ArrowDown') {
          event.preventDefault();
          focusCard(cards.indexOf(card) + 1);
        } else if (event.key === 'ArrowLeft' || event.key === 'ArrowUp') {
          event.preventDefault();
          focusCard(cards.indexOf(card) - 1);
        }
      });
      cards.push(card);
      grid.appendChild(card);
    }
    cards[0]?.focus();
  }

  document.getElementById('cancel').addEventListener('click', () => window.capturePicker.cancel());
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') {
      event.preventDefault();
      window.capturePicker.cancel();
    }
  });

  // The main process injects the list once the page has loaded.
  window.__setSources = (sources) => render(Array.isArray(sources) ? sources : []);
  if (Array.isArray(window.__pendingSources)) window.__setSources(window.__pendingSources);
</script>
</body>
</html>
